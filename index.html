<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catálogo de productos — Tienda Cositas Divinas" />
    <meta name="theme-color" content="#8a5d49" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- ── Políticas de Seguridad y Cifrado ────────────── -->
    <!-- Forzar siempre HTTPS (SSL/TLS) y prevenir inyecciones XSS -->
    <meta
      http-equiv="Content-Security-Policy"
      content="upgrade-insecure-requests; default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self' https:; object-src 'none'; base-uri 'self';"
    />
    <!-- Prevención de rastreo indebido y protección de cabeceras -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Prevención de ataques MIME-sniffing -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- Restricción de permisos no utilizados en el dispositivo del usuario -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=()" />

    <!-- Preconexión a recursos externos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <title>Catálogo — Cositas Divinas</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
